server:
  port:8080

spring:
  application:
    name: gateway-server


  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://locadlhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus

